<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact &mdash; Jordan Ellis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Jordan Ellis</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <h1 class="mb-4 text-center">Get In Touch</h1>
      <p class="text-muted text-center mb-5">
        This form demonstrates Bootstrap's validation styling and input groups &mdash;
        it's a static example, so the states below are shown directly rather than triggered by real input.
      </p>

      <form class="mx-auto" style="max-width: 32rem;">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control is-valid" id="name" value="Alex Rivera">
          <div class="valid-feedback">Looks good!</div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control is-invalid" id="email" value="alex@example">
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-at"></i></span>
            <input type="text" class="form-control" id="username" placeholder="username">
          </div>
        </div>

        <div class="mb-4">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4" placeholder="What would you like to say?"></textarea>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send</button>
          <button type="button" class="btn btn-success"><i class="fa-solid fa-check"></i> Save Draft</button>
          <button type="reset" class="btn btn-outline-secondary"><i class="fa-solid fa-rotate-left"></i> Reset</button>
        </div>
      </form>
    </main>

    <footer class="site-footer text-center py-4">
      <div class="container">
        <div class="mb-2">
          <a href="#" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
          <a href="mailto:jordan@example.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <p class="mb-0 small text-white-50">&copy; 2026 Jordan Ellis.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
