<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order &amp; Reviews &mdash; The Green Fork</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html"><i class="fa-solid fa-utensils"></i> The Green Fork</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#appetizers">Appetizers</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#entrees">Entrees</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#desserts">Desserts</a></li>
            <li class="nav-item"><a class="nav-link active" href="order.html">Order</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <h1 class="mb-4 text-center">Place an Order or Leave a Review</h1>

      <form class="mx-auto" style="max-width: 34rem;" action="mailto:orders@greenfork.example" method="post" enctype="text/plain">
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="item" class="form-label">Item</label>
          <select class="form-select" id="item" name="item">
            <option>Roasted Beet Salad</option>
            <option>Buffalo Cauliflower</option>
            <option>Garlic Bread</option>
            <option>Spicy Peanut Noodles</option>
            <option>Herb-Roasted Chicken</option>
            <option>Wild Mushroom Pasta</option>
            <option>Flourless Chocolate Cake</option>
            <option>Apple Crumble</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity</label>
          <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1">
        </div>

        <div class="mb-4">
          <label for="comments" class="form-label">Comments / Review</label>
          <textarea class="form-control" id="comments" name="comments" rows="4" placeholder="Any notes, or tell us how the last visit went..."></textarea>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-success"><i class="fa-solid fa-cart-shopping"></i> Submit Order</button>
          <button type="reset" class="btn btn-outline-secondary"><i class="fa-solid fa-rotate-left"></i> Clear</button>
        </div>
      </form>
    </main>

    <footer class="site-footer text-center py-4 text-white">
      <p class="mb-0 small">&copy; 2026 The Green Fork.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
